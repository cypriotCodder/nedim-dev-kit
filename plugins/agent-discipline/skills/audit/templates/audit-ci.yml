# Copy to .github/workflows/audit.yml, and copy collect.mjs and lib/ to scripts/audit/
# (the audit skill can do both for you).
# Runs the deterministic audit on every PR and weekly; fails on release blockers.
# Not on npm? Change `cache` and `npm ci` below to your package manager.
name: audit

permissions:
  contents: read

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # churn hotspots need history
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install gitleaks # scans git history; the gate fails if it's missing or finds a secret there
        # Pinned by checksum as well as version, so a replaced release asset can't run here.
        # To update: take the new linux_x64 line from that release's gitleaks_<version>_checksums.txt.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Collect evidence + gate
        run: node scripts/audit/collect.mjs . --out .audit/raw --gate
      # Only the summary. The rest of .audit/raw quotes source code, and redaction only knows
      # secret formats it has been told about.
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-summary
          path: .audit/raw/summary.json
          retention-days: 14
